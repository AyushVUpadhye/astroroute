<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AstroRoute — Mission Control</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <span class="logo">⬡ AstroRoute</span>
    <div class="controls">
      <label>Target
        <select id="targetPicker"></select>
      </label>
      <label>Scenario
        <select id="scenarioPicker">
          <option value="default">Default</option>
          <option value="storm">Storm</option>
          <option value="comet-rain">Comet Rain</option>
        </select>
      </label>
      <label>Speed
        <select id="speedPicker">
          <option value="1">1×</option>
          <option value="4">4×</option>
          <option value="12" selected>12×</option>
          <option value="48">48×</option>
        </select>
      </label>
      <button id="btnPlayPause" title="Play / Pause">⏸</button>
      <button id="btnReset" title="Reset simulation">↺</button>
      <button id="btnAddAsteroid" title="Click map to drop asteroid">☄ Asteroid</button>
      <button id="btnAddComet" title="Click map to drop comet">🌠 Comet</button>
      <span id="clock" class="clock">t = 0.0 d</span>
      <span id="resScore" class="badge">—</span>
    </div>
  </header>

  <main id="layout">
    <section id="mapSection">
      <canvas id="mapCanvas"></canvas>
      <div id="tooltip" class="tooltip hidden"></div>
    </section>

    <aside id="sidebar">
      <div class="panel" id="routePanel">
        <h2>Route</h2>
        <div id="routeCard">—</div>
        <div id="altRouteCard" class="alt"></div>
      </div>

      <div class="panel" id="detectPanel">
        <h2>Exoplanet Detector — <span id="targetLabel">—</span></h2>
        <canvas id="lcCanvas" width="320" height="90"></canvas>
        <canvas id="pgCanvas" width="320" height="90"></canvas>
        <canvas id="foldCanvas" width="320" height="90"></canvas>
        <div id="verdictBox" class="verdict">—</div>
        <div id="checksBox" class="checks"></div>
      </div>

      <div class="panel" id="forecastPanel">
        <h2>24 h Threat Forecast</h2>
        <canvas id="forecastCanvas" width="320" height="70"></canvas>
      </div>

      <div class="panel" id="logPanel">
        <h2>Event Log</h2>
        <ul id="eventLog"></ul>
      </div>
    </aside>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
